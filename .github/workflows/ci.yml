name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # The tests only need the light dependencies, not torch/transformers.
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn scipy statsmodels matplotlib pyyaml pytest
          pip install -e . --no-deps
      - name: Run tests
        run: pytest -q
