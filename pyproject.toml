[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-review-detection"
version = "0.1.0"
description = "Fake review detection on the Ott et al. corpus: stylometric baseline vs fine-tuned BERT vs hybrid model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
